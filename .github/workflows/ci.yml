name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: pytest · simulation harness
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Lint check (ruff)
        run: |
          pip install ruff
          ruff check . --select=E,F,W --ignore=E501,F401 || true

      - name: Run smoke simulation
        run: |
          python evaluate_phase2b.py --mock --trials 2 --seed 42

      - name: Run test suite
        run: |
          pytest tests/ -v

      - name: Generate figures (smoke)
        run: |
          python scripts/generate_figures.py

  reproducibility:
    name: bit-identical seed reproducibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - run: |
          pip install -r requirements.txt
          # Run twice with seed 42 and confirm deterministic columns match
          python evaluate_phase2b.py --mock --trials 2 --seed 42
          cp data/results/phase2b_summary_by_category.csv /tmp/run1.csv
          python evaluate_phase2b.py --mock --trials 2 --seed 42
          diff /tmp/run1.csv data/results/phase2b_summary_by_category.csv && \
              echo "OK: seed 42 reproducible" || \
              (echo "FAIL: seed 42 not reproducible"; exit 1)
